---
- hosts: app-server
  become: no

  tasks:

    - name: Stop old container
      shell: docker stop dbhere || true

    - name: Remove old container
      shell: docker rm dbhere || true

    - name: Build Docker image
      shell: |
        cd /home/ubuntu/my_reposiotry/dbHere
        docker build -t dbhere-app .

    - name: Run container
      shell: |
        docker run -d \
        -p 8080:8080 \
        --name dbhere \
        --restart unless-stopped \
        -e SPRING_PROFILES_ACTIVE=${ENV} \
        dbhere-app